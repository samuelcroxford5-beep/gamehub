<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samuel's Ultimate Game Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    text-align:center;
    padding:20px;
}

h1{
    margin-bottom:20px;
    font-size:3rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}

button{
    margin:5px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#2563eb;
}

input{
    padding:10px;
    border-radius:10px;
    border:none;
    margin:5px;
}

#target{
    width:70px;
    height:70px;
    background:red;
    border-radius:50%;
    position:relative;
    margin:20px auto;
    cursor:pointer;
}

.leaderboard{
    text-align:left;
    max-width:300px;
    margin:auto;
}

footer{
    margin-top:40px;
    color:#94a3b8;
}
</style>
</head>
<body>

<h1>🎮 Samuel's Ultimate Game Hub</h1>

<div class="grid">

<div class="card">
<h2>⚡ Click Challenge</h2>
<h3 id="clickScore">0</h3>
<button onclick="clickGame()">CLICK!</button>
</div>

<div class="card">
<h2>🎯 Guess The Number</h2>
<input id="guessInput" type="number" min="1" max="100">
<button onclick="guess()">Guess</button>
<p id="guessResult"></p>
</div>

<div class="card">
<h2>✂️ Rock Paper Scissors</h2>
<button onclick="rps('Rock')">🪨</button>
<button onclick="rps('Paper')">📄</button>
<button onclick="rps('Scissors')">✂️</button>
<p id="rpsResult"></p>
</div>

<div class="card">
<h2>🔴 Target Clicker</h2>
<p>Score: <span id="targetScore">0</span></p>
<div id="target"></div>
</div>

<div class="card">
<h2>🏆 High Score</h2>
<input id="playerName" placeholder="Name">
<button onclick="saveScore()">Save Score</button>
<div class="leaderboard" id="leaderboard"></div>
</div>

</div>

<footer>
Built by Samuel 🚀
</footer>

<script>

let clicks=0;

function clickGame(){
clicks++;
document.getElementById("clickScore").innerText=clicks;
}

let secret=Math.floor(Math.random()*100)+1;

function guess(){
let g=Number(document.getElementById("guessInput").value);

if(g===secret){
document.getElementById("guessResult").innerHTML="✅ Correct!";
secret=Math.floor(Math.random()*100)+1;
}
else if(g<secret){
document.getElementById("guessResult").innerHTML="⬆️ Higher";
}
else{
document.getElementById("guessResult").innerHTML="⬇️ Lower";
}
}

function rps(player){

const options=["Rock","Paper","Scissors"];

const computer=
options[Math.floor(Math.random()*3)];

let result="";

if(player===computer){
result="Draw!";
}
else if(
(player==="Rock"&&computer==="Scissors")||
(player==="Paper"&&computer==="Rock")||
(player==="Scissors"&&computer==="Paper")
){
result="You Win!";
}
else{
result="Computer Wins!";
}

document.getElementById("rpsResult").innerHTML=
`You: ${player}<br>Computer: ${computer}<br>${result}`;
}

let targetScore=0;
const target=document.getElementById("target");

target.addEventListener("click",()=>{

targetScore++;
document.getElementById("targetScore").innerText=targetScore;

target.style.left=(Math.random()*200-100)+"px";
target.style.top=(Math.random()*200-100)+"px";

});

function saveScore(){

const name=
document.getElementById("playerName").value || "Anonymous";

const scores=
JSON.parse(localStorage.getItem("scores")) || [];

scores.push({
name:name,
score:targetScore
});

scores.sort((a,b)=>b.score-a.score);

localStorage.setItem(
"scores",
JSON.stringify(scores.slice(0,10))
);

loadScores();
}

function loadScores(){

const scores=
JSON.parse(localStorage.getItem("scores")) || [];

let html="<h3>Top Players</h3>";

scores.forEach((s,i)=>{
html+=`${i+1}. ${s.name} - ${s.score}<br>`;
});

document.getElementById("leaderboard").innerHTML=html;
}

loadScores();

</script>

</body>
</html>
